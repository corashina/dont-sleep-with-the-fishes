<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broken item review</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#102029;color:#f0e5d1;font:16px system-ui}header{max-width:1100px}h1{font-size:32px;margin:0 0 12px}p{color:#aec2ca;line-height:1.6}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,a{color:inherit}button{font:inherit;background:#243e49;border:1px solid #6c8790;padding:10px 18px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#eadbc0;color:#102029}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}article{background:#45565e;padding:16px;border:1px solid #35505d;border-radius:6px}h2{font-size:18px;margin:0}img{width:100%;display:block}.pair{display:grid;grid-template-columns:1fr 1fr}figure{margin:14px 0 0}figcaption{color:#e0e8eb;text-align:center}footer{margin-top:24px}</style><header><h1>Broken item review</h1><p>Bucket damage review. Each pair uses the same camera and display size.<br>Select a view. Click a model to enlarge it. Current game geometry and boat storage poses.</p></header><nav><button data-view="front" aria-pressed="true">Front three-quarter</button><button data-view="reverse" aria-pressed="false">Reverse three-quarter</button><button data-view="top" aria-pressed="false">Top</button></nav><main><article><h2>01 BUCKET</h2><div class="pair"><figure><figcaption>Intact</figcaption><a class="model" data-state="intact" href="bucket-intact-front.png?v=large-openings-3" target="_blank"><img src="bucket-intact-front.png?v=large-openings-3" alt="Intact BUCKET"></a></figure><figure><figcaption>Broken</figcaption><a class="model" data-state="broken" href="bucket-front.png?v=large-openings-3" target="_blank"><img src="bucket-front.png?v=large-openings-3" alt="Broken BUCKET"></a></figure></div></article></main><script>const ids=["bucket"];for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));document.querySelectorAll('.model').forEach((a,i)=>{a.href=ids[Math.floor(i/2)]+'-'+(a.dataset.state==='intact'?'intact-':'')+button.dataset.view+'.png?v=large-openings-3';a.firstElementChild.src=a.href})};</script></html>
